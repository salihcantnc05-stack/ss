<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davetiye - Şeyma & Salih</title>
    <style>
        .and {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #18324a;
            text-transform: uppercase;
            margin: 16px 0 20px;
            line-height: 1.5;
        }

        /* Konum Bağlantısı Stili */
        .location-link {
            color: inherit;
            text-decoration: none;
            display: inline-block;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .location-link:hover {
            color: #2b6cb0;
            text-decoration: underline;
        }

        /* Geri Sayım Sayacı Stilleri */
        .countdown-title {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #2b6cb0;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }

        .time-box {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px;
            min-width: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-box span:first-child {
            font-size: 1.4rem;
            font-weight: 700;
            color: #18324a;
        }

        .time-box span:last-child {
            font-size: 0.75rem;
            color: #718096;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h1 id="inv-title" class="names">Şeyma &amp; Salih</h1>

    <div class="and">
        SİZLERİ DE ARAMIZDA GÖRMEKTEN<br>
        MUTLULUK DUYARIZ 
    </div>

    <div class="details" aria-live="polite">
        <div class="detail-item">
            <span class="detail-strong">Tarih</span>
            13 Eylül 2026, Pazar — 18:00
        </div>

        <div class="detail-item">
            <span class="detail-strong">Yer</span>
            <a href="https://maps.app.goo.gl/FDXEq9BRYAKvxJMr5" target="_blank" rel="noopener noreferrer" class="location-link">
                Kalp Event House,<br>
                Sancaktepe / İstanbul 📍
            </a>
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-ghost" id="calendarBtn">
            Takvime Ekle
        </button>

        <button class="btn btn-ghost" id="downloadPdfBtn">
            PDF İndir
        </button>
    </div>

    <!-- GERİ SAYIM SAYACI -->
    <p class="countdown-title">Büyük Güne Kalan Süre</p>
    <div class="countdown-container">
        <div class="time-box"><span id="days">00</span><span>Gün</span></div>
        <div class="time-box"><span id="hours">00</span><span>Saat</span></div>
        <div class="time-box"><span id="minutes">00</span><span>Dakika</span></div>
        <div class="time-box"><span id="seconds">00</span><span>Saniye</span></div>
    </div>

    <!-- GERİ SAYIM JAVASCRIPT KODU -->
    <script>
        // Hedef Tarih: 13 Eylül 2026, 18:00
        const targetDate = new Date('2026-09-13T18:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.querySelector('.countdown-container').innerHTML = "<p style='font-weight:bold; color:#18324a;'>Büyük Gün Geldi!</p>";
                return;
            }

            // Gün, Saat, Dakika, Saniye Hesaplamaları
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // Çıktıları DOM'a aktarma
            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        // Sayfa yüklendiğinde çalıştır ve her 1 saniyede bir güncelle
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
